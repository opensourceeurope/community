# automation/infra/docker-compose.yml
services:
  postgres:
    # Pinned to a minor release, like every image here. A floating tag is
    # never refreshed: deploy.sh only acts on a tag that changed in git, so
    # `16-alpine` stayed at whatever was pulled on install day. Dependabot
    # proposes each new minor as a pull request. A major (17) is a dump and
    # restore, not a tag bump, and Dependabot is told to leave it alone.
    image: postgres:16.15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    # Pinned, not :latest — this stores live application state, and
    # `docker compose pull` must never drag a major n8n version across it
    # unattended. Bump this deliberately; see automation/infra/README.md.
    # ose-n8n-advisories.timer alerts Slack daily while a published security
    # advisory with a fix affects this tag.
    image: docker.n8n.io/n8nio/n8n:2.43.8
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # --- database: Postgres, not the default SQLite ---
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      # --- identity / URLs ---
      N8N_HOST: ${N8N_HOST}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${N8N_HOST}/
      N8N_EDITOR_BASE_URL: https://${N8N_HOST}
      GENERIC_TIMEZONE: Europe/Berlin
      # --- execution history: prune it, or a year of runs fills the disk ---
      # Nothing to do with throughput. n8n keeps the full payload of every
      # execution forever by default; two weeks is long enough to debug what
      # happened to an applicant and short enough to never think about disk.
      EXECUTIONS_DATA_PRUNE: ${EXECUTIONS_DATA_PRUNE}
      EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE}
      # --- credential encryption: losing this loses every stored credential ---
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # The workflows read their configuration via $env expressions, which
      # newer n8n blocks by default. Without this, no workflow can even be
      # activated ("access to env vars denied").
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # --- hardening: switch off what this instance does not use ---
      # Usage telemetry to n8n. The editor shows applicant rows, and nothing
      # about this instance needs to leave the box to make it work.
      N8N_DIAGNOSTICS_ENABLED: "false"
      # n8n's own isolation guide clears these too. Without them the editor
      # can still load n8n's tracking scripts in the browser.
      EXTERNAL_FRONTEND_HOOKS_URLS: ""
      N8N_DIAGNOSTICS_CONFIG_FRONTEND: ""
      N8N_DIAGNOSTICS_CONFIG_BACKEND: ""
      N8N_PERSONALIZATION_ENABLED: "false"
      # Every node here is a core node. A community package is third-party
      # code running inside n8n with access to every credential.
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      # The deploy uses the public API. Nobody needs its interactive docs
      # served to the internet.
      N8N_PUBLIC_API_SWAGGERUI_DISABLED: "true"
      # Caddy is the one proxy in front, so n8n reads the client address from
      # X-Forwarded-For. Without it the login rate limit sees every request
      # coming from Caddy.
      N8N_PROXY_HOPS: "1"
      # --- application config (see automation/infra/README.md) ---
      DRY_RUN: ${DRY_RUN}
      DRY_RUN_RECIPIENT: ${DRY_RUN_RECIPIENT}
      REMINDER_AFTER_MINUTES: ${REMINDER_AFTER_MINUTES}
      ESCALATE_AFTER_MINUTES: ${ESCALATE_AFTER_MINUTES}
      SWEEP_CRON: ${SWEEP_CRON}
      SUMMARY_CRON: ${SUMMARY_CRON}
      STALE_CLAIM_MINUTES: ${STALE_CLAIM_MINUTES}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL}
      AI_BASE_URL: ${AI_BASE_URL}
      FORM_URL_OSE: ${FORM_URL_OSE}
      SMTP_FROM: ${SMTP_FROM}
      SLACK_CHANNEL: ${SLACK_CHANNEL}
    volumes:
      - n8n_data:/home/node/.n8n

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on: [n8n]
    environment:
      # Caddy substitutes these itself at runtime, so they must be in the
      # container's environment, not merely interpolated by Compose.
      N8N_HOST: ${N8N_HOST}
      APPLY_HOST: ${APPLY_HOST}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The one file Caddy serves itself, rather than proxying: the link
      # preview image for the application form. See the Caddyfile.
      - ./public:/srv/public:ro
      # The editor gate's user and password hash, which the Caddyfile imports.
      - ./editor-auth.caddy:/etc/caddy/editor-auth.caddy:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  n8n_data:
  caddy_data:
  caddy_config:
