# Boots the n8n version production runs and imports every export in
# automation/n8n into it, so a pull request finds out here that an export names
# a node the pinned n8n build does not have. The image tag is read out of
# automation/infra/docker-compose.yml by the script, and the container is
# thrown away with the runner. Nothing in this job reaches the live instance.
name: check the exports load on n8n

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Boot n8n and import the exports
        run: automation/test/n8n-import-check.sh

      - name: Run the admin nodes in n8n
        run: python3 automation/test/admin-details.py

      # Fails when a node that builds Slack text throws on its sample, or has no sample
      # in automation/test/fixtures/slack-preview.json, so the preview keeps covering
      # every message.
      - name: Render every Slack message in n8n
        run: python3 automation/scripts/slack-preview.py --all --base ''
